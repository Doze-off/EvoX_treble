name: Android CI

on:
  push:
    branches: [ "bka" ]
  pull_request:
    branches: [ "bka" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
- name: Checkout repository
  uses: actions/checkout@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
